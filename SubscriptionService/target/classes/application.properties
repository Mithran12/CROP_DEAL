spring.application.name=subscription-service
server.port=8088

# Standalone development
spring.cloud.config.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_subscription_db
spring.datasource.username=root
spring.datasource.password=system
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ listener
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# JWT - use the same secret as Auth Service during final integration
cropdeal.jwt.secret=${JWT_SECRET:CropDealSubscriptionJwtSecretKeyMustBeAtLeast32CharsLong!}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
