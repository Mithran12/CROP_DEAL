services:
  subscription-mysql:
    image: mysql:8.4
    container_name: cropdeal-subscription-mysql
    environment:
      MYSQL_ROOT_PASSWORD: system
      MYSQL_DATABASE: cropdeal_subscription_db
    ports:
      - "3307:3306"
    volumes:
      - subscription_mysql_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: cropdeal-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  subscription-service:
    build: .
    container_name: cropdeal-subscription-service
    depends_on:
      - subscription-mysql
      - rabbitmq
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://subscription-mysql:3306/cropdeal_subscription_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: system
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      JWT_SECRET: CropDealSubscriptionJwtSecretKeyMustBeAtLeast32CharsLong!

volumes:
  subscription_mysql_data:
