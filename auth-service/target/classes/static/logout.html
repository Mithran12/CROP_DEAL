<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CropDeal - Logout</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;font-family:Arial,sans-serif}
.card{width:min(420px,90vw);padding:30px;background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.12);text-align:center}
h1{margin:0 0 10px}.message{color:#555;margin-bottom:22px}
button{border:0;border-radius:8px;padding:12px 22px;background:#1877f2;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>CropDeal Logout</h1>
<div id="message" class="message">Signing you out...</div>
<button id="login" style="display:none">Go to Login</button>
</div>
<script>
(function () {
    // JWT is stateless: remove all client-side authentication state.
    localStorage.removeItem("cropdealToken");
    localStorage.removeItem("cropdealUser");
    sessionStorage.clear();

    const message = document.getElementById("message");
    const button = document.getElementById("login");
    message.textContent = "You have been logged out successfully.";
    button.style.display = "inline-block";
    button.addEventListener("click", function () {
        window.location.href = "/login";
    });
})();
</script>
</body>
</html>
