spring.config.import=optional:configserver:
spring.datasource.url=jdbc:h2:mem:cropdealtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
eureka.client.enabled=false
spring.cloud.config.enabled=false
spring.security.oauth2.client.registration.facebook.client-id=test-client
spring.security.oauth2.client.registration.facebook.client-secret=test-secret
spring.security.oauth2.client.provider.facebook.authorization-uri=https://example.com/oauth/authorize
spring.security.oauth2.client.provider.facebook.token-uri=https://example.com/oauth/token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://example.com/user
spring.security.oauth2.client.provider.facebook.user-name-attribute=id
