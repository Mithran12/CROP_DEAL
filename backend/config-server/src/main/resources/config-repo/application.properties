server.address=0.0.0.0
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.cloud.loadbalancer.cache.enabled=false
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=10000
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
jwt.secret=${JWT_SECRET:change-this-jwt-secret-to-a-strong-32-byte-value}
internal.api.key=${INTERNAL_API_KEY:change-this-internal-key}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Common local MySQL default; service-specific datasource settings can override this.
spring.datasource.password=${DB_PASSWORD:system}

