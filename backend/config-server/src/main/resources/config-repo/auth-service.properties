spring.application.name=auth-service
server.port=8088

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_auth_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

cropdeal.admin.email=${CROPDEAL_ADMIN_EMAIL:admin@cropdeal.com}
cropdeal.admin.password=${CROPDEAL_ADMIN_PASSWORD:Admin@123}

jwt.secret=${JWT_SECRET:change-this-jwt-secret-to-a-strong-32-byte-value}
jwt.expiration=86400000

server.address=0.0.0.0
