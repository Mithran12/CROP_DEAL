spring.application.name=crop-service
server.port=8083
# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_crop_db
spring.datasource.username=root
spring.datasource.password=system
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Logging
logging.level.com.cropdeal.crop=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.rabbit=DEBUG
# JWT
jwt.secret=CropDealSecretKeyForJwtAuthenticationMustBeAtLeast32CharactersLong