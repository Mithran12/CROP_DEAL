spring.application.name=review-service
server.port=8092
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.datasource.url=${REVIEW_DB_URL:jdbc:mysql://localhost:3306/cropdeal_review_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
jwt.secret=${JWT_SECRET:change-this-jwt-secret-to-a-strong-32-byte-value}
internal.api.key=${INTERNAL_API_KEY:change-this-internal-key}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
server.address=0.0.0.0
