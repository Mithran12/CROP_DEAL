spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/auth/**,/facebook-demo.html,/logout.html

jwt.secret=${JWT_SECRET:change-this-jwt-secret-to-a-strong-32-byte-value}

server.address=0.0.0.0

spring.cloud.gateway.server.webmvc.routes[8].id=wallet-service
