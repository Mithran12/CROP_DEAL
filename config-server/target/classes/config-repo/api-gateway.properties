spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.cloud.loadbalancer.cache.enabled=false

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=crop-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CROP-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/crops/**

spring.cloud.gateway.server.webmvc.routes[2].id=subscription-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://SUBSCRIPTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/subscriptions/**

spring.cloud.gateway.server.webmvc.routes[3].id=order-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/orders/**

spring.cloud.gateway.server.webmvc.routes[4].id=payment-service
