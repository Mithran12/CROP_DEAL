spring.application.name=wallet-service
server.port=8089
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cropdeal_wallet_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
internal.api.key=${CROPDEAL_INTERNAL_KEY:cropdeal-internal-123}
jwt.secret=${CROPDEAL_JWT_SECRET:mycropdealsecretkeymycropdealsecretkey123456}
jwt.expiration=86400000
spring.cloud.loadbalancer.cache.enabled=false
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=10000
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
