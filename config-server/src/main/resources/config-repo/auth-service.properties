# =========================================================
# AUTH SERVICE
# =========================================================

spring.application.name=auth-service
server.port=8088

# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cropdeal_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# EUREKA
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =========================================================
# JWT
# =========================================================

jwt.secret=${CROPDEAL_JWT_SECRET:mycropdealsecretkeymycropdealsecretkey123456}
jwt.expiration=86400000

# =========================================================
# ADMIN ACCOUNT
# =========================================================

cropdeal.admin.email=admin@cropdeal.com
cropdeal.admin.password=Admin@123
cropdeal.admin.name=CropDeal Admin

# =========================================================
# INTERNAL SERVICE KEY
# =========================================================

facebook.enabled=${FACEBOOK_ENABLED:false}
facebook.graph-url=${FACEBOOK_GRAPH_URL:https://graph.facebook.com/me}

internal.api.key=cropdeal-internal-123

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# =========================================================
# SWAGGER
# =========================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html