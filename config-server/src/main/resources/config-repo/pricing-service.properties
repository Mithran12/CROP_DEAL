spring.application.name=pricing-service

server.port=8090

# DATABASE
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cropdeal_pricing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# EUREKA
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT
jwt.secret=${CROPDEAL_JWT_SECRET:mycropdealsecretkeymycropdealsecretkey123456}

# GOVERNMENT MARKET PRICE API
pricing.gov-api.base-url=https://api.data.gov.in/resource
pricing.gov-api.resource-id=9ef84268-d588-465a-a308-a864a43d0070
pricing.gov-api.key=${DATA_GOV_IN_API_KEY:}
pricing.gov-api.default-state=${PRICING_GOV_DEFAULT_STATE:Tamil Nadu}
pricing.gov-api.demo-fallback=${PRICING_GOV_DEMO_FALLBACK:true}

# INTERNAL API
internal.api.key=cropdeal-internal-123

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html