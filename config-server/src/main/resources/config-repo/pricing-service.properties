spring.application.name=pricing-service
server.port=8090

spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_pricing_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

jwt.secret=${JWT_SECRET:change-this-jwt-secret-to-a-strong-32-byte-value}