spring.application.name=config-server
server.port=8888
server.address=0.0.0.0
spring.profiles.active=${CONFIG_REPOSITORY_TYPE:native}
spring.cloud.config.server.native.search-locations=classpath:/config-repo
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/your-github-user/cropdeal-config.git}
spring.cloud.config.server.git.default-label=${CONFIG_GIT_BRANCH:main}
spring.cloud.config.server.git.clone-on-start=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
