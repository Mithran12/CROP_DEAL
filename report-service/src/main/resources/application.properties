spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.application.name=report-service
server.port=8087

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.cloud.loadbalancer.cache.enabled=false
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=10000

spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_report_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:change-this-jwt-secret-to-a-strong-32-byte-value}

server.address=0.0.0.0
internal.api.key=${INTERNAL_API_KEY:change-this-internal-key}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
