<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="soyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcf3cf"/>
      <stop offset="100%" stop-color="#f9e79f"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#soyBg)" rx="12"/>
  <!-- Soybean Pods and Beans -->
  <g transform="translate(100, 75)">
    <!-- Pod -->
    <path d="M-40,15 Q-10,-25 35,-5 Q10,35 -40,15 Z" fill="#82e0aa" stroke="#229954" stroke-width="2"/>
    <!-- Individual Beans inside -->
    <ellipse cx="-20" cy="8" rx="8" ry="6" fill="#f7dc6f"/>
    <ellipse cx="-2" cy="5" rx="8" ry="6" fill="#f7dc6f"/>
    <ellipse cx="16" cy="3" rx="8" ry="6" fill="#f7dc6f"/>
  </g>
  <text x="100" y="140" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700" fill="#7d6608" text-anchor="middle">Yellow Soybean Pods</text>
</svg>
