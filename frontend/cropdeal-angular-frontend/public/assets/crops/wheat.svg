<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="wheatSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#f5e6b3"/>
    </linearGradient>
    <linearGradient id="wheatGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#d4ac0d"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#wheatSky)" rx="12"/>
  <circle cx="160" cy="40" r="22" fill="#fdebd0" opacity="0.6"/>
  <!-- Field line -->
  <path d="M0 120 Q50 110 100 120 T200 115 L200 150 L0 150 Z" fill="#e59866" opacity="0.3"/>
  <!-- Wheat Stalks -->
  <g transform="translate(100, 110)">
    <!-- Center Stalk -->
    <path d="M0,0 Q-2,-45 0,-85" stroke="#b7950b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="-7" cy="-70" rx="6" ry="12" fill="url(#wheatGold)" transform="rotate(-30, -7, -70)"/>
    <ellipse cx="7" cy="-60" rx="6" ry="12" fill="url(#wheatGold)" transform="rotate(30, 7, -60)"/>
    <ellipse cx="-7" cy="-50" rx="6" ry="12" fill="url(#wheatGold)" transform="rotate(-30, -7, -50)"/>
    <ellipse cx="7" cy="-40" rx="6" ry="12" fill="url(#wheatGold)" transform="rotate(30, 7, -40)"/>
    <ellipse cx="0" cy="-85" rx="5" ry="10" fill="url(#wheatGold)"/>
    <!-- Left Stalk -->
    <path d="M-15,10 Q-35,-30 -30,-65" stroke="#b7950b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-35" cy="-55" rx="5" ry="10" fill="url(#wheatGold)" transform="rotate(-40, -35, -55)"/>
    <ellipse cx="-24" cy="-45" rx="5" ry="10" fill="url(#wheatGold)" transform="rotate(20, -24, -45)"/>
    <!-- Right Stalk -->
    <path d="M15,10 Q35,-30 30,-65" stroke="#b7950b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="35" cy="-55" rx="5" ry="10" fill="url(#wheatGold)" transform="rotate(40, 35, -55)"/>
    <ellipse cx="24" cy="-45" rx="5" ry="10" fill="url(#wheatGold)" transform="rotate(-20, 24, -45)"/>
  </g>
  <text x="100" y="140" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700" fill="#7d6608" text-anchor="middle">Golden Sharbati Wheat</text>
</svg>
