<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="riceSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f8f5"/>
      <stop offset="100%" stop-color="#d1f2eb"/>
    </linearGradient>
    <linearGradient id="riceGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#riceSky)" rx="12"/>
  <circle cx="40" cy="35" r="18" fill="#fef9e7" opacity="0.8"/>
  <path d="M0 115 Q60 100 120 118 T200 112 L200 150 L0 150 Z" fill="#a2d9ce" opacity="0.4"/>
  <!-- Rice Sheaves -->
  <g transform="translate(100, 115)">
    <path d="M0,0 Q-10,-40 -25,-80" stroke="#1e8449" stroke-width="2.5" fill="none"/>
    <ellipse cx="-25" cy="-78" rx="4" ry="9" fill="#f9e79f" transform="rotate(-40, -25, -78)"/>
    <ellipse cx="-20" cy="-68" rx="4" ry="9" fill="#f9e79f" transform="rotate(-30, -20, -68)"/>
    <ellipse cx="-15" cy="-58" rx="4" ry="9" fill="#f9e79f" transform="rotate(-20, -15, -58)"/>
    <path d="M0,0 Q10,-40 25,-80" stroke="#1e8449" stroke-width="2.5" fill="none"/>
    <ellipse cx="25" cy="-78" rx="4" ry="9" fill="#f9e79f" transform="rotate(40, 25, -78)"/>
    <ellipse cx="20" cy="-68" rx="4" ry="9" fill="#f9e79f" transform="rotate(30, 20, -68)"/>
    <ellipse cx="15" cy="-58" rx="4" ry="9" fill="#f9e79f" transform="rotate(20, 15, -58)"/>
    <!-- Center Green Stalk -->
    <path d="M0,0 Q0,-50 0,-90" stroke="#27ae60" stroke-width="3" fill="none"/>
    <ellipse cx="0" cy="-90" rx="4" ry="10" fill="#f9e79f"/>
    <!-- Blade leaves -->
    <path d="M-5,-10 Q-30,-25 -40,-45" stroke="#229954" stroke-width="3" fill="none"/>
    <path d="M5,-10 Q30,-25 40,-45" stroke="#229954" stroke-width="3" fill="none"/>
  </g>
  <text x="100" y="140" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700" fill="#145a32" text-anchor="middle">Basmati Paddy / Rice</text>
</svg>
