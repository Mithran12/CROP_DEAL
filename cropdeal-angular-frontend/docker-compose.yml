services:
  mysql:
    image: mysql:8.4
    container_name: cropdeal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cropdeal_auth_db
    ports:
      - "3306:3306"
    volumes:
      - cropdeal_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  config-server:
    build: ./config-server
    container_name: cropdeal-config-server
    ports:
      - "8888:8888"
  eureka-server:
    build: ./eureka-server
    container_name: cropdeal-eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_started

  auth-service:
    build: ./auth-service
    container_name: cropdeal-auth-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cropdeal_auth_db
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: CropDealSecretKeyForJwtAuthentication2026Secure
      ADMIN_EMAIL: admin@cropdeal.com
      ADMIN_PASSWORD: admin123
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    container_name: cropdeal-api-gateway
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started

volumes:
  cropdeal_mysql_data:
