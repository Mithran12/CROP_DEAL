<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="potatoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfefe"/>
      <stop offset="100%" stop-color="#f2f3f4"/>
    </linearGradient>
    <linearGradient id="potatoBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4ac0d"/>
      <stop offset="100%" stop-color="#b7950b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#potatoBg)" rx="12"/>
  <!-- Potatoes -->
  <g transform="translate(100, 75)">
    <!-- Back Potato -->
    <path d="M-40,10 C-45,-15 -10,-28 15,-18 C35,-10 40,12 25,25 C10,32 -30,28 -40,10 Z" fill="#9a7d0a" opacity="0.7"/>
    <!-- Front Main Potato -->
    <path d="M-25,18 C-35,0 -20,-24 8,-20 C32,-18 42,6 30,22 C18,34 -15,32 -25,18 Z" fill="url(#potatoBrown)"/>
    <!-- Eyes / Dimples -->
    <ellipse cx="-10" cy="-6" rx="3" ry="1.5" fill="#7d6608" opacity="0.6"/>
    <ellipse cx="12" cy="2" rx="3" ry="1.5" fill="#7d6608" opacity="0.6"/>
    <ellipse cx="2" cy="14" rx="2.5" ry="1.2" fill="#7d6608" opacity="0.6"/>
    <ellipse cx="-14" cy="10" rx="2" ry="1" fill="#7d6608" opacity="0.6"/>
  </g>
  <text x="100" y="140" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700" fill="#6e2c00" text-anchor="middle">Kufri Jyoti Potatoes</text>
</svg>
