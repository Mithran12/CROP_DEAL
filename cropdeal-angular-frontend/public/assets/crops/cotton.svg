<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="cottonBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ebf5fb"/>
      <stop offset="100%" stop-color="#d6eaf8"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#cottonBg)" rx="12"/>
  <circle cx="50" cy="35" r="16" fill="#eaf2f8" opacity="0.8"/>
  <!-- Cotton Plant -->
  <g transform="translate(100, 75)">
    <!-- Branch -->
    <path d="M-20,40 Q-5,10 0,-10 Q5,-25 15,-40" stroke="#6e2c00" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Sepals -->
    <path d="M-15,-5 Q0,10 15,-5 Q0,-15 -15,-5" fill="#784212"/>
    <path d="M-22,-15 Q-5,0 -2,-25" stroke="#784212" stroke-width="2" fill="none"/>
    <path d="M22,-15 Q5,0 2,-25" stroke="#784212" stroke-width="2" fill="none"/>
    <!-- Fluffy Cotton Boll -->
    <circle cx="-12" cy="-14" r="14" fill="#ffffff"/>
    <circle cx="12" cy="-14" r="14" fill="#ffffff"/>
    <circle cx="0" cy="-24" r="15" fill="#fdfefe"/>
    <circle cx="0" cy="-6" r="14" fill="#f4f6f6"/>
    <!-- Small Leaf -->
    <path d="M-10,20 Q-28,15 -35,5 Q-20,5 -10,20" fill="#27ae60"/>
  </g>
  <text x="100" y="140" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700" fill="#1b4f72" text-anchor="middle">Long Staple Cotton</text>
</svg>
