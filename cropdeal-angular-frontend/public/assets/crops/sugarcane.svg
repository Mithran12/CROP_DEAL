<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="caneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eafaf1"/>
      <stop offset="100%" stop-color="#d5f5e3"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#caneBg)" rx="12"/>
  <!-- Sugarcane Stalks -->
  <g transform="translate(100, 75)">
    <!-- Cane 1 -->
    <rect x="-16" y="-55" width="10" height="95" rx="3" fill="#58d68d"/>
    <line x1="-16" y1="-30" x2="-6" y2="-30" stroke="#196f3d" stroke-width="2"/>
    <line x1="-16" y1="-5" x2="-6" y2="-5" stroke="#196f3d" stroke-width="2"/>
    <line x1="-16" y1="20" x2="-6" y2="20" stroke="#196f3d" stroke-width="2"/>
    <!-- Cane 2 -->
    <rect x="4" y="-45" width="11" height="85" rx="3" fill="#2ecc71"/>
    <line x1="4" y1="-20" x2="15" y2="-20" stroke="#196f3d" stroke-width="2"/>
    <line x1="4" y1="5" x2="15" y2="5" stroke="#196f3d" stroke-width="2"/>
    <line x1="4" y1="30" x2="15" y2="30" stroke="#196f3d" stroke-width="2"/>
    <!-- Leaves top -->
    <path d="M-11,-55 Q-25,-75 -40,-65" stroke="#1e8449" stroke-width="3" fill="none"/>
    <path d="M10,-45 Q25,-65 40,-55" stroke="#1e8449" stroke-width="3" fill="none"/>
  </g>
  <text x="100" y="140" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700" fill="#145a32" text-anchor="middle">Fresh Sugarcane</text>
</svg>
