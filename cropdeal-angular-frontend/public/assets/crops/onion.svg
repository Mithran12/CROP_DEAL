<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="onionBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5eef8"/>
      <stop offset="100%" stop-color="#ebdef0"/>
    </linearGradient>
    <linearGradient id="onionPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#884ea0"/>
      <stop offset="100%" stop-color="#6c3483"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#onionBg)" rx="12"/>
  <!-- Red Onion -->
  <g transform="translate(100, 75)">
    <!-- Root hairs bottom -->
    <path d="M-6,26 Q-10,36 -8,42 M0,27 Q2,38 0,44 M6,26 Q10,36 8,42" stroke="#d7bde2" stroke-width="1.5" fill="none"/>
    <!-- Onion Bulb -->
    <path d="M0,-24 C28,-22 36,12 18,25 C6,30 -6,30 -18,25 C-36,12 -28,-22 0,-24 Z" fill="url(#onionPurple)"/>
    <!-- Skin highlights -->
    <path d="M0,-20 C18,-18 24,8 12,20 C4,24 -4,24 -12,20 C-24,8 -18,-18 0,-20 Z" stroke="#bb8fce" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- Neck Top -->
    <path d="M-4,-24 L-2,-38 L2,-38 L4,-24 Z" fill="#5b2c6f"/>
    <!-- Sprout Shoot -->
    <path d="M0,-38 Q-8,-50 -12,-55 M0,-38 Q6,-52 10,-56" stroke="#27ae60" stroke-width="2" fill="none"/>
  </g>
  <text x="100" y="140" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700" fill="#4a235a" text-anchor="middle">Nasik Red Onions</text>
</svg>
