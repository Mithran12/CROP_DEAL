<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="maizeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9e7"/>
      <stop offset="100%" stop-color="#fdebd0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#maizeBg)" rx="12"/>
  <circle cx="155" cy="40" r="20" fill="#fcf3cf" opacity="0.6"/>
  <!-- Corn Cob -->
  <g transform="translate(100, 75)">
    <!-- Husk Left -->
    <path d="M-15,35 Q-38,-5 -15,-45 Q-10,-5 -5,35" fill="#52be80" opacity="0.9"/>
    <!-- Husk Right -->
    <path d="M15,35 Q38,-5 15,-45 Q10,-5 5,35" fill="#48c9b0" opacity="0.9"/>
    <!-- Cob Body -->
    <rect x="-14" y="-38" width="28" height="68" rx="14" fill="#f4d03f"/>
    <!-- Kernels Pattern -->
    <g fill="#d68910" opacity="0.7">
      <circle cx="-7" cy="-24" r="2.5"/><circle cx="0" cy="-24" r="2.5"/><circle cx="7" cy="-24" r="2.5"/>
      <circle cx="-7" cy="-14" r="2.5"/><circle cx="0" cy="-14" r="2.5"/><circle cx="7" cy="-14" r="2.5"/>
      <circle cx="-7" cy="-4" r="2.5"/><circle cx="0" cy="-4" r="2.5"/><circle cx="7" cy="-4" r="2.5"/>
      <circle cx="-7" cy="6" r="2.5"/><circle cx="0" cy="6" r="2.5"/><circle cx="7" cy="6" r="2.5"/>
      <circle cx="-7" cy="16" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="7" cy="16" r="2.5"/>
    </g>
    <!-- Silk Top -->
    <path d="M-6,-40 Q-2,-52 0,-50 Q4,-54 6,-40" stroke="#b7950b" stroke-width="2" fill="none"/>
  </g>
  <text x="100" y="140" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700" fill="#7e5109" text-anchor="middle">Hybrid Maize / Corn</text>
</svg>
