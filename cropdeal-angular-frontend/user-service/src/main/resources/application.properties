spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.application.name=user-service
server.port=8081

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_user_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:change-this-jwt-secret-to-a-strong-32-byte-value}
internal.api.key=${INTERNAL_API_KEY:change-this-internal-key}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

server.address=0.0.0.0