spring.application.name=order-service

server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_order_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

cropdeal.jwt.secret=${JWT_SECRET:CropDealSecretKeyForJwtAuthentication2026Secure}
cropdeal.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

management.endpoints.web.exposure.include=health,info

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Resilience4j - User Service
resilience4j.circuitbreaker.instances.userService.register-health-indicator=true
resilience4j.circuitbreaker.instances.userService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.userService.sliding-window-size=5
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=2

# Resilience4j - Crop Service
resilience4j.circuitbreaker.instances.cropService.register-health-indicator=true
resilience4j.circuitbreaker.instances.cropService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.cropService.sliding-window-size=5
resilience4j.circuitbreaker.instances.cropService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.cropService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cropService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.cropService.permitted-number-of-calls-in-half-open-state=2